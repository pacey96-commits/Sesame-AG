name: Build SesameAG Android APK
on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        env:
          ANDROID_NDK_VERSION: 27.2.12479018

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend dependencies
        run: pnpm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli

      - name: Build Android Release APK
        run: cargo tauri android build --apk

      - name: Locate APK file
        run: find . -name "*.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SesameAG-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

